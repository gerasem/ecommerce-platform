name: Deploy Backend

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify dependencies
        run: |
          npm ci --legacy-peer-deps
          npm test

      # Keep newly disclosed dependency advisories visible without making an
      # otherwise healthy production deployment impossible. Dependency updates
      # are reviewed and tested separately instead of being forced by npm audit.
      - name: Audit production dependencies
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=high

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:production
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVER_URL=${{ secrets.SERVER_URL || 'https://example.com' }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.DEPLOY_PATH || '/var/www/shop' }}

            # Ensure environment file exists
            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi

            docker compose pull backend
            docker compose stop backend
            docker compose run --rm -T --no-deps backend sh -lc "printf 'y\n' | npm run payload migrate"
            docker compose up -d backend

            healthy=false
            for attempt in $(seq 1 30); do
              if docker compose exec -T backend node -e "fetch('http://127.0.0.1:3000/api/globals/shop-settings?depth=0').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"; then
                healthy=true
                break
              fi
              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              docker compose logs --tail=100 backend
              exit 1
            fi

            docker image prune -f
