query HomeCategoryProducts($locale: LocaleInputType!, $categoryId: JSON!) {
  Products(locale: $locale, limit: 4, where: { categories: { equals: $categoryId } }) {
    docs {
      id
      title
      slug
      baseCurrency
      priceInEUR
      priceInUSD
      description
      inventory
      enableVariants
      variants {
        docs {
          id
          priceInEUR
          priceInUSD
        }
      }
      gallery {
        id
        url
        thumbnailURL
        width
        height
        alt
      }
    }
  }
}
