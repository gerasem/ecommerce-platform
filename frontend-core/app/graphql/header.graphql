query Header($locale: LocaleInputType!) {
  Header(locale: $locale) {
    icon {
      id
      svgContent
    }
    slogan
    navItems {
      id
      link {
        label
        type
        newTab
        reference {
          value {
            ... on Page {
              id
              slug
              view
            }
          }
        }
        url
      }
    }
    navButtons {
      id
      link {
        label
        type
        newTab
        reference {
          value {
            ... on Page {
              id
              slug
              view
            }
          }
        }
        url
      }
    }
    headerPages {
      id
      slug
      title
      view
    }
    importantNotice {
      showNotice
      noticeText
      noticeIcon {
        id
        svgContent
      }
    }
  }
}
